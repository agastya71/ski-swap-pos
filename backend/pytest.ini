[pytest]
testpaths = tests
pythonpath = .
# Parallel by default (pytest-xdist, 8 workers on 8 cores): per-test in-memory
# SQLite engines + tmp_path make every test fully isolated. Run serially with
# `pytest -n0` (or `-o addopts=""`), e.g. when debugging a flaky ordering
# issue. NOTE: -p no:xdist does NOT work — addopts' -n arg then has no parser.
addopts = -n auto
